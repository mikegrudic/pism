[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jaco"
version = "0.1.1"
authors = [
  { name="Mike Grudić", email="mike.grudic@gmail.com" },
]
description = "object-oriented ISM processes"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "jax", "sympy", "numpy", "sphinx_rtd_theme", "astropy", "matplotlib", "periodictable"
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/mikegrudic/jaco"
Issues = "https://github.com/mikegrudic/jaco/issues"

[tool.setuptools.package-data]
"jaco.models.starforge" = ["spcool_tables.hdf5"]
"jaco.codegen" = ["*.h"]